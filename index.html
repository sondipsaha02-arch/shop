                                        </div>
                                        <div>
                                            <label className="text-[11px] font-bold text-slate-600 dark:text-slate-400">বিক্রয়মূল্য (৳)</label>
                                            <input type="number" required value={productForm.sellPrice} onChange={e => setProductForm({...productForm, sellPrice: e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 dark:text-white border dark:border-slate-700 rounded-xl text-xs font-bold" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[11px] font-bold text-slate-600 dark:text-slate-400">স্টক</label>
                                        <input type="number" step="any" required value={productForm.stock} onChange={e => setProductForm({...productForm, stock: e.target.value})} className="w-full p-2 bg-slate-50 dark:bg-slate-800 dark:text-white border dark:border-slate-700 rounded-xl text-xs font-bold" />
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-blue-600 text-white font-black rounded-xl text-xs shadow-md water-drop-btn">সংরক্ষণ</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADD CATEGORY */}
                    {showAddCatModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-card bg-white/95 dark:bg-slate-900 rounded-3xl p-5 max-w-xs w-full space-y-3">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-black text-sm text-slate-900 dark:text-white">নতুন ক্যাটাগরি যোগ</h3>
                                    <button onClick={() => setShowAddCatModal(false)}><Icon name="X" size={16} /></button>
                                </div>
                                <form onSubmit={handleAddCustomCategory} className="space-y-2.5">
                                    <input type="text" required autoFocus value={newCategoryName} onChange={e => setNewCategoryName(e.target.value)} placeholder="ক্যাটাগরির নাম লিখুন" className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 dark:text-white border dark:border-slate-700 rounded-xl text-xs font-bold" />
                                    <button type="submit" className="w-full py-2 bg-blue-600 text-white rounded-xl text-xs font-black water-drop-btn">তৈরি করুন</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADD CUSTOM UNIT */}
                    {showAddUnitModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="glass-card bg-white/95 dark:bg-slate-900 rounded-3xl p-5 max-w-xs w-full space-y-3 shadow-2xl">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-black text-sm text-slate-900 dark:text-white">নতুন কাস্টম ইউনিট যোগ</h3>
                                    <button onClick={() => setShowAddUnitModal(false)}><Icon name="X" size={16} /></button>
                                </div>
                                <form onSubmit={handleAddCustomUnit} className="space-y-2.5">
                                    <input type="text" required autoFocus value={newUnitName} onChange={e => setNewUnitName(e.target.value)} placeholder="যেমন: হালি, ডজন, গজ, বোতল..." className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 dark:text-white border dark:border-slate-700 rounded-xl text-xs font-bold" />
                                    <button type="submit" className="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-black water-drop-btn">ইউনিট সংরক্ষণ করুন</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: INVOICE MEMO (CLASSIC CLEAN DESIGN) */}
                    {showInvoiceModal && (
                        <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-5 max-w-xs w-full space-y-3 shadow-2xl text-slate-900">
                                <div id="printable-memo-area" className="bg-white p-2 space-y-3 text-slate-900">
                                    <div className="text-center border-b border-slate-200 pb-2 flex flex-col items-center">
                                        {storeInfo.logoUrl && <img src={storeInfo.logoUrl} alt="Logo" className="w-10 h-10 object-cover rounded-full mb-1" />}
                                        <h3 className="font-black text-lg text-slate-900">{storeInfo.shopName || 'Smart Shop'}</h3>
                                        <p className="text-[10px] text-slate-500">by Sondip</p>
                                        <p className="text-xs font-bold text-slate-700 mt-1">ক্যাশ মেমো / রশিদ</p>
                                        <div className="flex justify-between w-full text-[10px] text-slate-600 mt-2">
                                            <span>আইডি: #{showInvoiceModal.id}</span>
                                            <span>তারিখ: {showInvoiceModal.date}</span>
                                        </div>
                                        {showInvoiceModal.customerName && (
                                            <div className="w-full text-left text-[11px] font-bold text-slate-700 mt-1">
                                                ক্রেতা: {showInvoiceModal.customerName} {showInvoiceModal.customerPhone !== 'N/A' ? `(${showInvoiceModal.customerPhone})` : ''}
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-1.5 text-xs">
                                        {showInvoiceModal.items?.map((it, idx) => (
                                            <div key={idx} className="flex justify-between items-center border-b border-slate-100 pb-1">
                                                <div>
                                                    <span className="font-bold text-slate-900">{it.name}</span>
                                                    {it.unit === 'kg' && it.grams ? (
                                                        <span className="text-[10px] text-emerald-700 font-bold block">({formatGramsToKgOrGram(it.grams)})</span>
                                                    ) : (
                                                        <span className="text-[10px] text-blue-700 font-bold block">({formatNumber(it.qty)} {getUnitLabel(it.unit)})</span>
                                                    )}
                                                </div>
                                                <span className="font-black text-slate-900">৳{formatNumber(it.sellPrice)}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="border-t border-slate-200 pt-2 space-y-1 text-xs font-bold">
                                        <div className="flex justify-between">
                                            <span>মোট:</span>
                                            <span>৳{formatNumber(showInvoiceModal.total)}</span>
                                        </div>
                                        <div className="flex justify-between text-emerald-700">
                                            <span>জমা:</span>
                                            <span>৳{formatNumber(showInvoiceModal.paid)}</span>
                                        </div>
                                        {showInvoiceModal.due > 0 && (
                                            <div className="flex justify-between text-rose-600">
                                                <span>বাকি:</span>
                                                <span>৳{formatNumber(showInvoiceModal.due)}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="space-y-2 pt-2 no-print">
                                    <button onClick={() => handleShareWhatsApp(showInvoiceModal)} className="w-full py-2 bg-[#25D366] text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
                                        <Icon name="WhatsApp" size={16} /> WhatsApp-এ পাঠান
                                    </button>
                                    <div className="flex gap-1.5">
                                        <button onClick={() => handleDownloadPDF(showInvoiceModal)} className="flex-1 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                                            <Icon name="Download" size={14} /> PDF সেভ
                                        </button>
                                        <button onClick={() => window.print()} className="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                                            <Icon name="Printer" size={14} /> প্রিন্ট
                                        </button>
                                        <button onClick={() => setShowInvoiceModal(null)} className="py-2 px-3 bg-slate-200 text-slate-800 rounded-xl text-xs font-bold">
                                            বন্ধ
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
