<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shop by Sondip - POS & Digital Scale</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <!-- html2pdf for Direct PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Identity Services for Gmail Login & Google Sheets Scope -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

        * {
            font-family: 'Hind Siliguri', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(113, 113, 122, 0.45);
            border-radius: 9999px;
        }

        @keyframes slideIn {
            from { transform: translateY(8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-slide-in {
            animation: slideIn 0.2s ease-out forwards;
        }

        @keyframes waterRipple {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .water-drop-btn:active {
            animation: waterRipple 0.28s ease-out;
        }

        /* Frosted Glassmorphism & Comfortable Gray Dark Theme with Subtle Texture */
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }
        .dark .glass-header {
            background: rgba(39, 39, 42, 0.92);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(228, 228, 231, 0.95);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }
        .dark .glass-card {
            background: rgba(39, 39, 42, 0.92);
            border: 1px solid rgba(82, 82, 91, 0.65);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
        }

        .gray-texture-bg {
            background-color: #f4f4f5;
            background-image: radial-gradient(rgba(113, 113, 122, 0.14) 1px, transparent 0);
            background-size: 18px 18px;
        }
        .dark .gray-texture-bg {
            background-color: #18181b;
            background-image: radial-gradient(rgba(161, 161, 170, 0.09) 1px, transparent 0);
            background-size: 18px 18px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
        }
    </style>
</head>
<body class="gray-texture-bg text-zinc-800 dark:text-zinc-100 antialiased h-[100dvh] overflow-hidden select-none transition-colors duration-300">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SVG Icons Component ---
        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                LayoutDashboard: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>,
                ShoppingCart: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>,
                Package: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
                Trash2: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
                Plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
                X: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                Edit: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
                Printer: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
                Scale: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>,
                Search: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
                SlidersHorizontal: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/></svg>,
                Delete: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>,
                RotateCcw: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>,
                Check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
                Layers: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polygon points="2 17 12 22 22 17"/><polygon points="2 12 12 17 22 12"/></svg>,
                Sun: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>,
                Moon: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
                Settings: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                Download: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
                Share2: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            };
            return <span className={`inline-flex items-center justify-center ${className}`}>{icons[name] || null}</span>;
        };

        const toBanglaDigits = (num) => {
            if (num === null || num === undefined || num === "") return "";
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, (digit) => banglaDigits[digit]);
        };

        const formatNumber = (num) => {
            if (!num || isNaN(num)) return "০";
            const formatted = Number.isInteger(num) ? num.toString() : Number(num).toFixed(2).replace(/\.?0+$/, '');
            return toBanglaDigits(formatted);
        };

        const formatGramsToKgOrGram = (grams) => {
            if (!grams || isNaN(grams)) return "";
            const g = Number(grams);
            if (g >= 1000) {
                const kg = g / 1000;
                return Number.isInteger(kg) ? `${formatNumber(kg)} কেজি` : `${formatNumber(kg)} কেজি (${formatNumber(g)} গ্রাম)`;
            }
            return `${formatNumber(g)} গ্রাম`;
        };

        const DEFAULT_UNITS = [
            { id: 'kg', label: 'কেজি' },
            { id: 'gram', label: 'গ্রাম' },
            { id: 'bosta', label: 'বস্তা' },
            { id: 'hali', label: 'হালি' },
            { id: 'dozen', label: 'ডজন' },
            { id: 'packet', label: 'প্যাকেট' },
            { id: 'carton', label: 'কার্টন' },
            { id: 'liter', label: 'লিটার' },
            { id: 'piece', label: 'পিস' }
        ];

        const DEFAULT_CATEGORIES = ['মসলা', 'চাল', 'তেল', 'সাধারণ'];

        const getCompatibleUnitsForBaseUnit = (baseUnit) => {
            if (baseUnit === 'kg' || baseUnit === 'gram') {
                return ['kg', 'gram'];
            }
            if (baseUnit === 'bosta') {
                return ['bosta', 'kg', 'gram'];
            }
            if (baseUnit === 'hali' || baseUnit === 'dozen' || baseUnit === 'piece') {
                return ['hali', 'dozen', 'piece'];
            }
            return [baseUnit || 'piece'];
        };

        const INITIAL_PRODUCTS = [
            { id: 1, name: 'জিরা', category: 'মসলা', buyPrice: 650, sellPrice: 750, stock: 25, unit: 'kg', allowedUnits: ['kg', 'gram'], bostaSizeKg: 25 },
            { id: 2, name: 'লং / লবঙ্গ', category: 'মসলা', buyPrice: 1200, sellPrice: 1400, stock: 15, unit: 'kg', allowedUnits: ['kg', 'gram'], bostaSizeKg: 25 },
            { id: 3, name: 'ছোট এলাচ', category: 'মসলা', buyPrice: 2400, sellPrice: 2800, stock: 10, unit: 'kg', allowedUnits: ['kg', 'gram'], bostaSizeKg: 25 },
            { id: 4, name: 'দারুচিনি', category: 'মসলা', buyPrice: 420, sellPrice: 500, stock: 30, unit: 'kg', allowedUnits: ['kg', 'gram'], bostaSizeKg: 25 },
            { id: 5, name: 'তেজপাতা', category: 'মসলা', buyPrice: 150, sellPrice: 200, stock: 40, unit: 'kg', allowedUnits: ['kg', 'gram'], bostaSizeKg: 25 },
            { id: 6, name: 'সয়াবিন তেল (খোলা)', category: 'তেল', buyPrice: 150, sellPrice: 165, stock: 100, unit: 'liter', allowedUnits: ['liter'], bostaSizeKg: 50 },
            { id: 7, name: 'মিনিকেট চাল', category: 'চাল', buyPrice: 3100, sellPrice: 3400, stock: 10, unit: 'bosta', allowedUnits: ['bosta', 'kg', 'gram'], bostaSizeKg: 50 },
            { id: 8, name: 'দেশি চিনি', category: 'সাধারণ', buyPrice: 6500, sellPrice: 7000, stock: 2, unit: 'bosta', allowedUnits: ['bosta', 'kg', 'gram'], bostaSizeKg: 50 },
            { id: 9, name: 'ফার্মের ডিম', category: 'সাধারণ', buyPrice: 40, sellPrice: 48, stock: 60, unit: 'hali', allowedUnits: ['hali', 'dozen', 'piece'], bostaSizeKg: 50 }
        ];

        // --- GROUPED MIXED SPICE CALCULATOR ---
        const GroupSpiceCalculator = ({ products, onAddToCart }) => {
            const spiceProducts = useMemo(() => products.filter(p => p.category === 'মসলা' || p.unit === 'kg'), [products]);
            const [selectedItems, setSelectedItems] = useState(() => spiceProducts.slice(0, 4).map(p => p.id));
            const [targetBudget, setTargetBudget] = useState("50");

            const toggleSpice = (id) => {
                if (selectedItems.includes(id)) {
                    if (selectedItems.length > 1) {
                        setSelectedItems(selectedItems.filter(i => i !== id));
                    }
                } else {
                    setSelectedItems([...selectedItems, id]);
                }
            };

            const calculatedBreakdown = useMemo(() => {
                const budget = Number(targetBudget) || 0;
                if (budget <= 0 || selectedItems.length === 0) return [];
                const perItemBudget = budget / selectedItems.length;

                return selectedItems.map(id => {
                    const prod = products.find(p => p.id === id);
                    if (!prod) return null;
                    const pricePerGram = prod.sellPrice / 1000;
                    const grams = pricePerGram > 0 ? (perItemBudget / pricePerGram) : 0;
                    return {
                        id: prod.id,
                        name: prod.name,
                        allocatedPrice: Math.round(perItemBudget * 100) / 100,
                        grams: Math.round(grams)
                    };
                }).filter(Boolean);
            }, [targetBudget, selectedItems, products]);

            const handlePushGroupToCart = () => {
                if (!calculatedBreakdown.length) return;
                const totalAmt = Number(targetBudget) || 0;
                const itemsSummary = calculatedBreakdown.map(b => `${b.name}: ${formatGramsToKgOrGram(b.grams)}`).join(', ');
                onAddToCart({
                    id: Date.now(),
                    name: `মিক্স মসলা প্যাকেজ (${itemsSummary})`,
                    sellPrice: totalAmt,
                    qty: 1,
                    grams: null,
                    unit: 'packet',
                    unitPrice: totalAmt,
                    buyPrice: Math.round(totalAmt * 0.8)
                });
            };

            return (
                <div className="glass-card rounded-3xl p-4 max-w-xl mx-auto animate-slide-in">
                    <div className="flex items-center gap-3 pb-2 border-b border-zinc-200 dark:border-zinc-700">
                        <div className="w-8 h-8 rounded-xl bg-amber-500 text-zinc-950 flex items-center justify-center font-bold">
                            <Icon name="Layers" size={18} />
                        </div>
                        <div>
                            <h3 className="font-extrabold text-sm">গ্রুপ মসলা অনুপাত হিসাবক</h3>
                            <p className="text-[11px] text-zinc-500 dark:text-zinc-400 font-bold">বাজেট অনুযায়ী মসলার গ্রাম হিসেব করুন</p>
                        </div>
                    </div>

                    <div className="mt-3 space-y-3">
                        <div className="bg-amber-50/90 dark:bg-zinc-800/90 border border-amber-300/80 dark:border-zinc-700 p-3 rounded-2xl flex items-center justify-between gap-2 flex-wrap">
                            <label className="text-xs font-black">বাজেট:</label>
                            <div className="flex items-center gap-2">
                                <span className="font-black text-base">৳</span>
                                <input
                                    type="number"
                                    value={targetBudget}
                                    onChange={e => setTargetBudget(e.target.value)}
                                    className="w-24 p-1.5 bg-white dark:bg-zinc-900 border-2 border-amber-400 rounded-xl font-black text-sm text-center"
                                />
                                {[20, 50, 100].map(val => (
                                    <button
                                        key={val}
                                        onClick={() => setTargetBudget(val.toString())}
                                        className="px-2 py-1 bg-white dark:bg-zinc-900 border border-amber-300 dark:border-zinc-700 rounded-lg text-xs font-bold water-drop-btn"
                                    >
                                        {toBanglaDigits(val)}৳
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                            {spiceProducts.map(p => {
                                const isSelected = selectedItems.includes(p.id);
                                return (
                                    <button
                                        key={p.id}
                                        onClick={() => toggleSpice(p.id)}
                                        className={`p-2 rounded-xl border text-left text-xs font-bold transition-all flex items-center justify-between water-drop-btn ${
                                            isSelected
                                                ? 'bg-zinc-800 dark:bg-zinc-200 text-white dark:text-zinc-900 border-zinc-800 dark:border-zinc-200'
                                                : 'bg-zinc-50 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border-zinc-200 dark:border-zinc-700'
                                        }`}
                                    >
                                        <span className="truncate pr-1">{p.name}</span>
                                        {isSelected && <Icon name="Check" size={14} className="shrink-0" />}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="bg-zinc-900 dark:bg-zinc-950 text-white p-3 rounded-2xl space-y-2 border border-zinc-800">
                            <div className="grid grid-cols-2 gap-2">
                                {calculatedBreakdown.map((item) => (
                                    <div key={item.id} className="bg-zinc-800/90 p-2 rounded-xl border border-zinc-700/70 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-xs text-zinc-100">{item.name}</div>
                                            <div className="text-[10px] text-zinc-400">৳{formatNumber(item.allocatedPrice)} টাকার</div>
                                        </div>
                                        <div className="text-xs font-black text-emerald-400">{formatGramsToKgOrGram(item.grams)}</div>
                                    </div>
                                ))}
                            </div>
                            <button
                                onClick={handlePushGroupToCart}
                                className="w-full mt-1 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-black py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 water-drop-btn"
                            >
                                <Icon name="ShoppingCart" size={15} />
                                মেমোতে যোগ করুন (৳{formatNumber(Number(targetBudget) || 0)})
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- NO-SCROLL SINGLE WEIGHT & PRICE CALCULATOR ---
        const WeightCalculator = ({ onAddToCart }) => {
            const [baseWeight, setBaseWeight] = useState(1000);
            const [basePrice, setBasePrice] = useState("160");
            const [isRateOpen, setIsRateOpen] = useState(false);
            const [activeInput, setActiveInput] = useState('target');
            const [calcMode, setCalcMode] = useState('weightToPrice');
            const [targetValue, setTargetValue] = useState("250");

            const unitPrice = (baseWeight && basePrice) ? (Number(basePrice) / Number(baseWeight)) : 0;
            let result = 0;
            if (unitPrice > 0 && targetValue) {
                result = calcMode === 'weightToPrice' ? Number(targetValue) * unitPrice : Number(targetValue) / unitPrice;
            }

            const handleNumpadClick = (val) => {
                const currentValue = activeInput === 'target'
                    ? targetValue.toString()
                    : activeInput === 'basePrice'
                        ? basePrice.toString()
                        : baseWeight.toString();

                const setValueFunc = activeInput === 'target'
                    ? setTargetValue
                    : activeInput === 'basePrice'
                        ? setBasePrice
                        : setBaseWeight;

                if (val === 'backspace') setValueFunc(currentValue.slice(0, -1));
                else if (val === 'clear') setValueFunc("");
                else if (val === '.' && !currentValue.includes('.')) setValueFunc(currentValue + '.');
                else if (val !== '.') setValueFunc(currentValue + val);
            };

            const handlePushToCart = () => {
                if (!result || result <= 0) return;
                const weightDesc = calcMode === 'weightToPrice' ? Number(targetValue) : Math.round(result);
                const finalPrice = calcMode === 'weightToPrice' ? Math.round(result) : Number(targetValue);

                    grams: weightDesc,
                    unitPrice: Number(basePrice) || 0,

                    unit: 'kg',

            return (

                                        <label className="text-[10px] font-bold text-zinc-500">ওজন (গ্রাম)</label>

                                        <label className="text-[10px] font-bold text-zinc-500">মূল্য (টাকা)</label>

                        {onAddToCart && (

                    <div className="glass-card p-2 rounded-2xl shrink-0">

                                    key={num}
                                    onClick={() => handleNumpadClick((idx + 1).toString())}

                                <Icon name="RotateCcw" size={14} /> সাফ
                            </button>
                            <button
                                onClick={() => handleNumpadClick('0')}
                                className="py-2.5 bg-zinc-100/80 dark:bg-zinc-800 font-extrabold text-base rounded-xl active:scale-95"
                            >

                            </button>
                            <button
                                onClick={() => handleNumpadClick('backspace')}
                                className="py-2.5 bg-zinc-200 dark:bg-zinc-700 font-bold text-sm rounded-xl flex items-center justify-center active:scale-95"
                            >

                    </div>

            );
        };

        // --- MAIN APPLICATION ---
        function App() {
            const [activeTab, setActiveTab] = useState('pos');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('smart_pos_dark') === 'true');
            const [toastMsg, setToastMsg] = useState('');

            // Shop Branding Settings

            // Categories & Units
            const [customCategories, setCustomCategories] = useState(() => {

            });
            const [customUnits, setCustomUnits] = useState(() => {
                const saved = localStorage.getItem('smart_pos_units');
                return saved ? JSON.parse(saved) : DEFAULT_UNITS;
            });

            const [selectedCategoryTab, setSelectedCategoryTab] = useState('সব');
            const [showAddCatModal, setShowAddCatModal] = useState(false);
            const [newCatName, setNewCatName] = useState('');
            const [showAddUnitModal, setShowAddUnitModal] = useState(false);
            const [newUnitLabel, setNewUnitLabel] = useState('');
            const [newUnitPackQty, setNewUnitPackQty] = useState('1');
            const [newUnitItemSize, setNewUnitItemSize] = useState('');
            const [newUnitItemSizeUnit, setNewUnitItemSizeUnit] = useState('kg');
            const [newUnitTargetProductId, setNewUnitTargetProductId] = useState('selected');

            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('smart_pos_products');
                return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
            });

            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('smart_pos_transactions');
                return saved ? JSON.parse(saved) : [];
            });

            const [cart, setCart] = useState(() => {
                const saved = localStorage.getItem('smart_pos_cart_draft');
                return saved ? JSON.parse(saved) : [];
            });

            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [paidAmount, setPaidAmount] = useState('');
            const [discount, setDiscount] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [showInvoiceModal, setShowInvoiceModal] = useState(null);

            const [priceModalProduct, setPriceModalProduct] = useState(null);
            const [modalUnit, setModalUnit] = useState('kg');
            const [activeModalField, setActiveModalField] = useState('amount'); // 'amount' | 'grams' | 'qty'
            const [inputCustomAmount, setInputCustomAmount] = useState('');
            const [inputCustomGrams, setInputCustomGrams] = useState('');
            const [inputCustomQty, setInputCustomQty] = useState('1');

            // Edit / Add Product State
            const [editingProduct, setEditingProduct] = useState(null);
            const [productForm, setProductForm] = useState({
                name: '',
                category: 'মসলা',
                buyPrice: '',
                sellPrice: '',
                stock: '',
                unit: 'kg',
                allowedUnits: ['kg', 'gram'],
                bostaSizeKg: 50
            });
            const [showProductModal, setShowProductModal] = useState(false);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => {
                    setToastMsg('');
                }, 2200);
            };

            const getUnitLabel = (unitId) => {
                const found = customUnits.find(u => u.id === unitId);
                return found ? found.label : (unitId || '');
            };

            const getUnitSpec = (unitId) => {
                return customUnits.find(u => u.id === unitId) || null;
            };

            const getProductSelectableUnits = (itemOrProduct) => {
                const baseU = itemOrProduct?.baseUnit || itemOrProduct?.unit || 'piece';
                const configured = Array.isArray(itemOrProduct?.allowedUnits) && itemOrProduct.allowedUnits.length > 0
                    ? itemOrProduct.allowedUnits
                    : getCompatibleUnitsForBaseUnit(baseU);
                const productScopedCustomIds = Array.isArray(itemOrProduct?.customUnitIds)
                    ? itemOrProduct.customUnitIds
                    : [];
                const merged = Array.from(new Set([baseU, ...configured, ...productScopedCustomIds]));
                return merged.filter(uId => customUnits.some(u => u.id === uId));
            };

            const getUnitMultiplierInBase = (unitId, product) => {
                const bostaKg = Number(product?.bostaSizeKg) || 50;
                const baseUnit = product?.unit || 'kg';
                const spec = getUnitSpec(unitId);

                if (unitId === baseUnit) return 1;
                if (unitId === 'bosta') {
                    if (baseUnit === 'bosta') return 1;
                    if (baseUnit === 'kg') return bostaKg;
                    if (baseUnit === 'gram') return bostaKg * 1000;
                }
                if (unitId === 'kg') {
                    if (baseUnit === 'kg') return 1;
                    if (baseUnit === 'gram') return 1000;
                    if (baseUnit === 'bosta') return 1 / bostaKg;
                }
                if (unitId === 'gram') {
                    if (baseUnit === 'gram') return 1;
                    if (baseUnit === 'kg') return 1 / 1000;
                    if (baseUnit === 'bosta') return 1 / (bostaKg * 1000);
                }
                if (unitId === 'hali') {
                    if (baseUnit === 'hali') return 1;
                    if (baseUnit === 'piece') return 4;
                    if (baseUnit === 'dozen') return 4 / 12;
                }
                if (unitId === 'dozen') {
                    if (baseUnit === 'dozen') return 1;
                    if (baseUnit === 'piece') return 12;
                    if (baseUnit === 'hali') return 12 / 4;
                }
                if (unitId === 'piece') {
                    if (baseUnit === 'piece') return 1;
                    if (baseUnit === 'hali') return 1 / 4;
                    if (baseUnit === 'dozen') return 1 / 12;
                }

                // Custom unit calculation using packQty & itemSize / itemSizeUnit
                if (spec) {
                    const packQty = Number(spec.packQty) || 1;
                    const itemSize = Number(spec.itemSize) || 0;
                    const sizeUnit = spec.itemSizeUnit || baseUnit;

                    if (itemSize > 0) {
                        const totalContentInSizeUnit = packQty * itemSize;
                        if (sizeUnit === baseUnit) return totalContentInSizeUnit;
                        if (sizeUnit === 'liter' && baseUnit === 'liter') return totalContentInSizeUnit;
                        if (sizeUnit === 'kg' && baseUnit === 'kg') return totalContentInSizeUnit;
                        if (sizeUnit === 'kg' && baseUnit === 'gram') return totalContentInSizeUnit * 1000;
                        if (sizeUnit === 'gram' && baseUnit === 'kg') return totalContentInSizeUnit / 1000;
                        if (sizeUnit === 'gram' && baseUnit === 'gram') return totalContentInSizeUnit;
                        if (sizeUnit === 'piece' && baseUnit === 'piece') return totalContentInSizeUnit;
                        if (sizeUnit === 'piece' && baseUnit === 'hali') return totalContentInSizeUnit / 4;
                        if (sizeUnit === 'piece' && baseUnit === 'dozen') return totalContentInSizeUnit / 12;
                    }
                    return packQty;
                }

                return 1;
            };

            // Convert base sellPrice into rate per targetUnit (e.g., 1 hali = 4 pcs, 1 dozen = 12 pcs, bostaSizeKg = 25/50 kg, or custom pack/carton)
            const getEffectiveRate = (basePrice, fromUnit, toUnit, bostaSizeKg = 50, product = null) => {
                const price = Number(basePrice) || 0;
                const bostaKg = Number(bostaSizeKg) || 50;
                if (!price) return 0;
                if (fromUnit === toUnit) return price;

                const prodCtx = product || { unit: fromUnit, bostaSizeKg };
                const fromMult = getUnitMultiplierInBase(fromUnit, prodCtx);
                const toMult = getUnitMultiplierInBase(toUnit, prodCtx);

                const customSpec = getUnitSpec(toUnit);
                if (customSpec && (Number(customSpec.packQty) > 0 || Number(customSpec.itemSize) > 0)) {
                    const pricePerBase = price / (fromMult || 1);
                    return pricePerBase * toMult;
                }

                let pricePerKg = null;
                if (fromUnit === 'kg') pricePerKg = price;
                else if (fromUnit === 'gram') pricePerKg = price * 1000;
                else if (fromUnit === 'bosta') pricePerKg = price / bostaKg;

                if (pricePerKg !== null) {
                    if (toUnit === 'kg') return pricePerKg;
                    if (toUnit === 'gram') return pricePerKg / 1000;
                    if (toUnit === 'bosta') return pricePerKg * bostaKg;
                }

                let pricePerPiece = null;
                if (fromUnit === 'piece') pricePerPiece = price;
                else if (fromUnit === 'hali') pricePerPiece = price / 4;
                else if (fromUnit === 'dozen') pricePerPiece = price / 12;

                if (pricePerPiece !== null) {
                    if (toUnit === 'piece') return pricePerPiece;
                    if (toUnit === 'hali') return pricePerPiece * 4;
                    if (toUnit === 'dozen') return pricePerPiece * 12;
                }

                if (toMult > 0 && fromMult > 0) {
                    return (price / fromMult) * toMult;
                }

                return price;
            };

            const handleDownloadPDF = () => {
                const element = document.getElementById('printable-invoice');
                if (!element) {
                    window.print();
                    return;
                }
                if (typeof html2pdf === 'function') {
                    html2pdf()
                        .set({
                            margin: 8,
                            filename: `memo_${showInvoiceModal?.id || 'receipt'}.pdf`,
                            image: { type: 'jpeg', quality: 0.98 },
                            html2canvas: { scale: 2, useCORS: true },
                            jsPDF: { unit: 'mm', format: 'a6', orientation: 'portrait' }
                        })
                        .from(element)
                        .save()
                        .catch(() => window.print());
                } else {
                    window.print();
                }
            };

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('smart_pos_dark', darkMode.toString());
            }, [darkMode]);

            useEffect(() => {
                localStorage.setItem('smart_pos_shop_name', shopName);
            }, [shopName]);

            useEffect(() => {
                localStorage.setItem('smart_pos_shop_sub', shopSubTitle);
            }, [shopSubTitle]);

            useEffect(() => {
                localStorage.setItem('smart_pos_shop_logo', shopLogoUrl);
            }, [shopLogoUrl]);

            useEffect(() => {
                localStorage.setItem('smart_pos_report_wa', reportWhatsappPhone);
            }, [reportWhatsappPhone]);

            useEffect(() => {
                localStorage.setItem('smart_pos_categories', JSON.stringify(customCategories));
            }, [customCategories]);

            useEffect(() => {
                localStorage.setItem('smart_pos_units', JSON.stringify(customUnits));
            }, [customUnits]);

            useEffect(() => {
                localStorage.setItem('smart_pos_products', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('smart_pos_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('smart_pos_cart_draft', JSON.stringify(cart));
            }, [cart]);

            const syncToGoogleSheet = async (tx, allProducts = products) => {
                const now = new Date();
                const isoDate = tx.isoDate || now.toISOString().slice(0, 10);
                const dayKey = tx.dayKey || isoDate;
                const monthKey = tx.monthKey || isoDate.slice(0, 7);
                const yearKey = tx.yearKey || isoDate.slice(0, 4);

                const payload = {
                    type: 'sale',
                    gmail: connectedGmail || '',
                    id: tx.id,
                    date: tx.date,
                    isoDate,
                    dayKey,
                    monthKey,
                    yearKey,
                    customerName: tx.customerName,
                    customerPhone: tx.customerPhone || 'N/A',
                    subtotal: tx.subtotal || tx.total,
                    discount: tx.discount || 0,
                    total: tx.total,
                    paid: tx.paid,
                    due: tx.due,
                    profit: tx.profit || 0,
                    items: tx.items.map(i => `${i.name} (${i.grams ? formatGramsToKgOrGram(i.grams) : `${i.qty} ${getUnitLabel(i.unit)}`}) - ৳${i.sellPrice}`).join(' | '),
                    productsCount: allProducts.length,
                    stockSnapshot: allProducts.map(p => `${p.name}: ${p.stock} ${getUnitLabel(p.unit)}`).join(' | ')
                };

                let synced = false;

                // 1. Direct Google Sheets API push using connected Gmail OAuth token
                if (googleAccessToken && targetSpreadsheetId.trim()) {
                    try {
                        const rowValues = [
                            payload.id,
                            payload.date,
                            payload.dayKey,
                            payload.monthKey,
                            payload.yearKey,
                            payload.gmail || 'Gmail',
                            payload.customerName,
                            payload.customerPhone,
                            payload.items,
                            payload.total,
                            payload.paid,
                            payload.due,
                            payload.profit,
                            payload.stockSnapshot
                        ];

                        const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(targetSpreadsheetId.trim())}/values/Sales!A:N:append?valueInputOption=USER_ENTERED`;
                        const res = await fetch(apiUrl, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${googleAccessToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ values: [rowValues] })
                        });

                        if (res.ok) {
                            synced = true;
                        } else if (res.status === 401 || res.status === 403) {
                            setGoogleAccessToken('');
                        }
                    } catch (err) {
                        console.warn('Direct Google Sheets API sync error:', err);
                    }
                }

                // 2. Optional Apps Script Webhook backup
                if (sheetWebhookUrl) {
                    try {
                        await fetch(sheetWebhookUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        });
                        synced = true;
                    } catch (e) {
                        console.error(e);
                    }
                }

                if (synced) {
                    showToast(`${connectedGmail ? connectedGmail + ' এর ' : ''}Google Sheet-এ হিসাব যুক্ত হয়েছে`);
                } else if (sheetWebhookUrl || targetSpreadsheetId) {
                    showToast('Google Sheet সিঙ্কে সমস্যা হয়েছে');
                }
            };

            const handleConnectGmail = () => {
                const emailInput = connectedGmail.trim();
                if (!googleClientId.trim()) {
                    if (emailInput) {
                        setConnectedGmail(emailInput);
                        showToast(`${emailInput} সেভ হয়েছে (Google Sheets API-এর জন্য Client ID দিন)`);
                    } else {
                        showToast('Gmail ঠিকানা এবং Google Client ID দিন');
                    }
                    return;
                }

                if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
                    showToast('Google Login সার্ভিস লোড হচ্ছে, আবার চেষ্টা করুন');
                    return;
                }

                const tokenClient = window.google.accounts.oauth2.initTokenClient({
                    client_id: googleClientId.trim(),
                    scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email',
                    hint: emailInput || undefined,
                    callback: async (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            setGoogleAccessToken(tokenResponse.access_token);
                            let resolvedEmail = emailInput;
                            try {
                                const userRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                    headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                                });
                                if (userRes.ok) {
                                    const profile = await userRes.json();
                                    if (profile.email) {
                                        resolvedEmail = profile.email;
                                        setConnectedGmail(profile.email);
                                    }
                                }
                            } catch (_) {}

                            // Ensure Sales tab exists in target spreadsheet
                            if (targetSpreadsheetId.trim()) {
                                try {
                                    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(targetSpreadsheetId.trim())}:batchUpdate`, {
                                        method: 'POST',
                                        headers: {
                                            'Authorization': `Bearer ${tokenResponse.access_token}`,
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify({
                                            requests: [{ addSheet: { properties: { title: 'Sales' } } }]
                                        })
                                    });
                                } catch (_) {}
                            }

                    const script = document.createElement('script');
                    const timeout = setTimeout(() => {
                        cleanup();
                        reject(new Error('JSONP timeout'));
                    }, 10000);

                    const cleanup = () => {
                        clearTimeout(timeout);
                        delete window[cbName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                    };

                    window[cbName] = (payload) => {
                        cleanup();
                        resolve(payload);
                    };

                    script.onerror = () => {
                        cleanup();
                        reject(new Error('JSONP script error'));

                    const sep = url.includes('?') ? '&' : '?';

}

  });
  return respond(records);
}`;
