                    return `${toBanglaDigits(idx + 1)}. ${it.name} (${qtyText}) - ৳${formatNumber(it.amount)}`;
                });

                return [
                    `*${shopName}* (${shopSubTitle})`,
                    `📅 *দৈনিক বিক্রির রিপোর্ট:* ${toBanglaDigits(todayIso)} (${todayDateBn})`,
                    `🧾 মোট মেমো: ${formatNumber(todayTx.length)}টি`,
                    `💰 মোট বিক্রি: ৳${formatNumber(totalSale)}`,
                    `✅ মোট জমা: ৳${formatNumber(totalPaid)}`,
                    `⏳ মোট বাকি: ৳${formatNumber(totalDue)}`,
                    `📈 আনুমানিক লাভ: ৳${formatNumber(totalProfit)}`,
                    itemLines.length ? `\n*বিক্রিত পণ্যের হিসাব:*\n${itemLines.join('\n')}` : '\nআজ এখনো কোনো পণ্য বিক্রি হয়নি।'
                ].join('\n');
            };

            const handleShareDailyReportToWhatsapp = () => {
                const reportText = buildDailyReportText();
                const waPhone = formatWhatsappPhone(reportWhatsappPhone);
                const encodedText = encodeURIComponent(reportText);
                const waUrl = waPhone
                    ? `https://wa.me/${waPhone}?text=${encodedText}`
                    : `https://wa.me/?text=${encodedText}`;

                window.open(waUrl, '_blank', 'noopener,noreferrer');
                showToast('WhatsApp রিপোর্ট প্রস্তুত হয়েছে');
            };

            const handleCopyDailyReport = () => {
                const reportText = buildDailyReportText();
                const tempInput = document.createElement('textarea');
                tempInput.value = reportText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showToast('দৈনিক রিপোর্ট কপি হয়েছে');
            };

            const handleAddCategory = (e) => {
                e.preventDefault();
                const trimmed = newCatName.trim();
                if (!trimmed) return;
                if (!customCategories.includes(trimmed)) {
                    setCustomCategories(prev => [...prev, trimmed]);
                }
                setSelectedCategoryTab(trimmed);
                setNewCatName('');
                setShowAddCatModal(false);
            };

            const handleAddCustomUnit = (e) => {
                e.preventDefault();
                const trimmed = newUnitLabel.trim();
                if (!trimmed) return;
                const packQty = Number(newUnitPackQty) || 1;
                const itemSize = Number(newUnitItemSize) || 0;
                const sizeUnit = newUnitItemSizeUnit || 'liter';
                const unitId = trimmed.toLowerCase().replace(/\s+/g, '_') + '_' + Date.now().toString().slice(-3);
                const newUnitObj = {
                    id: unitId,
                    label: trimmed,
                    packQty,
                    itemSize,
                    itemSizeUnit: sizeUnit
                };
                setCustomUnits(prev => [...prev, newUnitObj]);

                const targetId = newUnitTargetProductId === 'selected'
                    ? priceModalProduct?.id
                    : Number(newUnitTargetProductId);

                if (targetId) {
                    setProducts(prev => prev.map(p => {
                        if (p.id !== targetId) return p;
                        const prevAllowed = Array.isArray(p.allowedUnits) ? p.allowedUnits : getCompatibleUnitsForBaseUnit(p.unit);
                        const prevScoped = Array.isArray(p.customUnitIds) ? p.customUnitIds : [];
                        return {
                            ...p,
                            allowedUnits: Array.from(new Set([...prevAllowed, unitId])),
                            customUnitIds: Array.from(new Set([...prevScoped, unitId]))
                        };
                    }));

                    if (priceModalProduct && priceModalProduct.id === targetId) {
                        setPriceModalProduct(prev => {
                            if (!prev) return null;
                            const prevAllowed = Array.isArray(prev.allowedUnits) ? prev.allowedUnits : getCompatibleUnitsForBaseUnit(prev.unit);
                            const prevScoped = Array.isArray(prev.customUnitIds) ? prev.customUnitIds : [];
                            return {
                                ...prev,
                                allowedUnits: Array.from(new Set([...prevAllowed, unitId])),
                                customUnitIds: Array.from(new Set([...prevScoped, unitId]))
                            };
                        });
                    }
                }

                setModalUnit(unitId);
                setNewUnitLabel('');
                setNewUnitPackQty('1');
                setNewUnitItemSize('');
                setNewUnitItemSizeUnit('kg');
                setNewUnitTargetProductId('selected');
                setShowAddUnitModal(false);
                showToast(`"${trimmed}" ইউনিট শুধু নির্বাচিত পণ্যে যোগ হয়েছে`);
            };

            const openAddProductModal = () => {
                setEditingProduct(null);
                const defaultCat = customCategories[0] || 'মসলা';
                setProductForm({
                    name: '',
                    category: defaultCat,
                    buyPrice: '',
                    sellPrice: '',
                    stock: '',
                    unit: 'kg',
                    allowedUnits: ['kg', 'gram'],
                    bostaSizeKg: 50
                });
                setShowProductModal(true);
            };

            const openEditProductModal = (product) => {
                setEditingProduct(product);
                const baseU = product.unit || 'kg';
                const currentAllowed = Array.isArray(product.allowedUnits) && product.allowedUnits.length > 0
                    ? product.allowedUnits
                    : getCompatibleUnitsForBaseUnit(baseU);
                setProductForm({
                    name: product.name,
                    category: product.category,
                    buyPrice: product.buyPrice,
                    sellPrice: product.sellPrice,
                    stock: product.stock,
                    unit: baseU,
                    allowedUnits: Array.from(new Set([baseU, ...currentAllowed])),
                    bostaSizeKg: product.bostaSizeKg || 50
                });
                setShowProductModal(true);
            };

            const handleFormBaseUnitChange = (newUnit) => {
                setProductForm(prev => ({
                    ...prev,
                    unit: newUnit,
                    allowedUnits: getCompatibleUnitsForBaseUnit(newUnit)
                }));
            };

            const toggleFormAllowedUnit = (unitId) => {
                setProductForm(prev => {
                    if (unitId === prev.unit) return prev;
                    const exists = prev.allowedUnits.includes(unitId);
                    const nextAllowed = exists
                        ? prev.allowedUnits.filter(u => u !== unitId)
                        : [...prev.allowedUnits, unitId];
                    return {
                        ...prev,
                        allowedUnits: nextAllowed.length > 0 ? nextAllowed : [prev.unit]
                    };
                });
            };

            const handleSaveProduct = (e) => {
                e.preventDefault();
                if (!productForm.name || !productForm.sellPrice) return;
                const normalizedAllowed = Array.from(
                    new Set([
                        productForm.unit,
                        ...(Array.isArray(productForm.allowedUnits) && productForm.allowedUnits.length > 0
                            ? productForm.allowedUnits
                            : [productForm.unit])
                    ])
                );
                const payload = {
                    ...productForm,
                    buyPrice: Number(productForm.buyPrice) || 0,
                    sellPrice: Number(productForm.sellPrice) || 0,
                    stock: Number(productForm.stock) || 0,
                    allowedUnits: normalizedAllowed,
                    bostaSizeKg: Number(productForm.bostaSizeKg) || 50
                };
                if (editingProduct) {
                    setProducts(prev => prev.map(p => p.id === editingProduct.id ? { ...p, ...payload } : p));
                } else {
                    setProducts(prev => [...prev, { id: Date.now(), ...payload }]);
                }
                setShowProductModal(false);
            };

            const handleDeleteProduct = (id) => {
                setProducts(prev => prev.filter(p => p.id !== id));
            };

            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    const matchesSearch = !searchQuery.trim() ||
                        p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        p.category.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCategory = searchQuery.trim() || selectedCategoryTab === 'সব' || p.category === selectedCategoryTab;
                    return matchesSearch && matchesCategory;
                });
            }, [products, searchQuery, selectedCategoryTab]);

            const navTabs = [
                { id: 'pos', label: 'স্টোর', icon: 'ShoppingCart' },
                { id: 'group_spice', label: 'গ্রুপ মসলা', icon: 'Layers' },
                { id: 'scale', label: 'ওজন', icon: 'Scale' },
                { id: 'products', label: 'স্টক', icon: 'Package' },
                { id: 'dashboard', label: 'রিপোর্ট', icon: 'LayoutDashboard' },
                { id: 'settings', label: 'সেটিংস', icon: 'Settings' }
            ];

            return (
                <div className="h-full flex flex-col gray-texture-bg text-zinc-800 dark:text-zinc-100 transition-colors">
                    {toastMsg && (
                        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-[100] bg-zinc-800 dark:bg-zinc-200 text-white dark:text-zinc-900 px-4 py-2 rounded-full text-xs font-bold shadow-xl">
                            {toastMsg}
                        </div>
                    )}

                    {/* Header */}
                    <header className="glass-header sticky top-0 z-40 shrink-0 no-print border-b border-zinc-200/80 dark:border-zinc-700/80">
                        <div className="max-w-7xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5 min-w-0">
                                {shopLogoUrl ? (
                                    <img
                                        src={shopLogoUrl}
                                        alt={shopName}
                                        onError={(e) => { e.currentTarget.style.display = 'none'; }}
                                        className="w-9 h-9 rounded-2xl object-cover border border-zinc-300 dark:border-zinc-700 shrink-0"
                                    />
                                ) : (
                                    <div className="w-9 h-9 rounded-2xl bg-zinc-800 dark:bg-zinc-200 text-emerald-400 dark:text-zinc-900 flex items-center justify-center font-black text-base shrink-0">
                                        {shopName ? shopName.slice(0, 1) : 'S'}
                                    </div>
                                )}
                                <div className="leading-tight truncate">
                                    <div className="font-extrabold text-sm sm:text-base truncate">{shopName}</div>
                                    <div className="text-[10px] text-zinc-500 dark:text-zinc-400 font-semibold truncate">{shopSubTitle}</div>
                                </div>
                            </div>

                            <nav className="hidden md:flex items-center gap-1 bg-zinc-200/75 dark:bg-zinc-800/90 p-1 rounded-2xl border border-zinc-300/60 dark:border-zinc-700/80">
                                {navTabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all water-drop-btn ${
                                            activeTab === tab.id
                                                ? 'bg-white dark:bg-zinc-700 text-zinc-950 dark:text-white shadow-xs'
                                                : 'text-zinc-600 dark:text-zinc-300 hover:text-zinc-950 dark:hover:text-white'
                                        }`}
                                    >
                                        <Icon name={tab.icon} size={15} />
                                        {tab.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="flex items-center gap-2 shrink-0">
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2 rounded-xl bg-zinc-200/80 dark:bg-zinc-800 text-zinc-800 dark:text-amber-300 border border-zinc-300/60 dark:border-zinc-700 water-drop-btn"
                                    title={darkMode ? 'Light Mode' : 'Dark Mode'}
                                >
                                    <Icon name={darkMode ? 'Sun' : 'Moon'} size={16} />
                                </button>
                                <button
                                    onClick={() => setActiveTab('pos')}
                                    className="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-black text-xs flex items-center gap-1 water-drop-btn"
                                >
                                    <Icon name="ShoppingCart" size={14} />
                                    <span>{toBanglaDigits(cart.length)}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-2.5 sm:p-3 overflow-y-auto custom-scrollbar pb-20 md:pb-3">
                        {activeTab === 'group_spice' && (
                            <GroupSpiceCalculator
                                products={products}
                                onAddToCart={(item) => {
                                    setCart(prev => [...prev, item]);
                                    setActiveTab('pos');
                                }}
                            />
                        )}

                        {activeTab === 'scale' && (
                            <div className="h-full animate-slide-in">
                                <WeightCalculator
                                    onAddToCart={(item) => {
                                        setCart(prev => [...prev, item]);
                                        setActiveTab('pos');
                                    }}
                                />
                            </div>
                        )}

                        {activeTab === 'pos' && (
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3.5 animate-slide-in">
                                {/* Shelf / Store Catalog */}
                                <div className="lg:col-span-7 flex flex-col gap-2.5">
                                    <div className="glass-card p-3 rounded-3xl space-y-2.5">
                                        <div className="relative">
                                            <Icon name="Search" size={16} className="absolute left-3 top-2.5 text-zinc-400" />
                                            <input
                                                type="text"
                                                placeholder="পণ্য খুঁজুন..."
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                className="w-full pl-9 pr-3 py-1.5 bg-zinc-100/90 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-xl text-xs font-bold focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>

                                        <div className="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-0.5">
                                            {['সব', ...customCategories].map(cat => (
                                                <button
                                                    key={cat}
                                                    onClick={() => { setSelectedCategoryTab(cat); setSearchQuery(''); }}
                                                    className={`px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap transition-all water-drop-btn ${
                                                        selectedCategoryTab === cat && !searchQuery
                                                            ? 'bg-zinc-800 dark:bg-zinc-200 text-white dark:text-zinc-900'
                                                            : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-700'
                                                    }`}
                                                >
                                                    {cat}
                                                </button>
                                            ))}
                                            <button
                                                onClick={() => setShowAddCatModal(true)}
                                                className="px-2.5 py-1 rounded-xl text-xs font-bold bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30 whitespace-nowrap water-drop-btn"
                                            >
                                                + ক্যাটাগরি
                                            </button>
                                        </div>
                                    </div>

                                    <div className="glass-card p-3 rounded-3xl grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[540px] overflow-y-auto custom-scrollbar">
                                        {filteredProducts.map(product => (
                                            <div
                                                key={product.id}
                                                onClick={() => handleProductClick(product)}
                                                className="p-3 rounded-2xl bg-zinc-50/90 dark:bg-zinc-800/90 border border-zinc-200/90 dark:border-zinc-700 hover:border-emerald-500 transition-all cursor-pointer flex flex-col justify-between water-drop-btn"
                                            >
                                                <div>
                                                    <div className="flex items-center justify-between gap-1">
                                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-zinc-200/80 dark:bg-zinc-700 text-zinc-700 dark:text-zinc-200">
                                                            {product.category}
                                                        </span>
                                                        <span className="text-[10px] font-bold text-zinc-500">
                                                            {getUnitLabel(product.unit)}
                                                        </span>
                                                    </div>
                                                    <h3 className="font-extrabold text-xs sm:text-sm mt-1.5">{product.name}</h3>
                                                </div>

                                                <div className="mt-2.5 flex items-end justify-between">
                                                    <div className="text-xs font-black text-emerald-600 dark:text-emerald-400">
                                                        ৳{formatNumber(product.sellPrice)}
                                                    </div>
                                                    <div className="w-7 h-7 rounded-xl bg-zinc-800 dark:bg-zinc-200 text-white dark:text-zinc-900 flex items-center justify-center">
                                                        <Icon name="Plus" size={15} />
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Sales Memo / Cart */}
                                <div className="lg:col-span-5 glass-card rounded-3xl p-4 flex flex-col justify-between h-fit">
                                    <div>
                                        <div className="flex items-center justify-between pb-2 border-b border-zinc-200 dark:border-zinc-700">
                                            <h2 className="font-black text-base flex items-center gap-1.5">
                                                <Icon name="ShoppingCart" size={18} className="text-emerald-500" />
                                                বিক্রয় মেমো
                                            </h2>
                                            <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-zinc-200 dark:bg-zinc-800">
                                                {formatNumber(cart.length)} টি
                                            </span>
                                        </div>

                                        <div className="space-y-2 my-3 max-h-[260px] overflow-y-auto custom-scrollbar pr-0.5">
                                            {cart.length === 0 ? (
                                                <div className="text-center py-8 text-xs font-bold text-zinc-400">
                                                    মেমো খালি আছে
                                                </div>
                                            ) : (
                                                cart.map(item => (
                                                    <div key={item.id} className="p-2.5 rounded-2xl bg-zinc-50 dark:bg-zinc-800/90 border border-zinc-200 dark:border-zinc-700 space-y-1.5">
                                                        <div className="flex items-center justify-between gap-2">
                                                            <div className="font-bold text-xs truncate">{item.name}</div>
                                                            <button
                                                                onClick={() => handleRemoveCartItem(item.id)}
                                                                className="text-rose-500 p-1 hover:bg-rose-500/10 rounded-lg"
                                                            >
                                                                <Icon name="Trash2" size={14} />
                                                            </button>
                                                        </div>

                                                        <div className="flex items-center gap-1.5">
                                                            <select
                                                                value={item.unit}
                                                                onChange={(e) => handleCartItemUnitChange(item.id, e.target.value)}
                                                                className="bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-lg px-1.5 py-1 text-[11px] font-bold"
                                                            >
                                                                {getProductSelectableUnits(item).map(uId => (
                                                                    <option key={uId} value={uId}>{getUnitLabel(uId)}</option>
                                                                ))}
                                                            </select>

                                                            {item.unit === 'kg' || item.unit === 'gram' ? (
                                                                <div className="flex items-center gap-1 flex-1">
                                                                    <input
                                                                        type="number"
                                                                        value={item.grams || ''}
                                                                        onChange={(e) => handleUpdateCartGrams(item.id, e.target.value)}
                                                                        placeholder="গ্রাম"
                                                                        className="w-full bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-lg px-1.5 py-1 text-xs font-black text-emerald-600 dark:text-emerald-400"
                                                                    />
                                                                    <span className="text-[10px] text-zinc-500">গ্রা</span>
                                                                </div>
                                                            ) : (
                                                                <div className="flex items-center gap-1 flex-1">
                                                                    <input
                                                                        type="number"
                                                                        step="any"
                                                                        value={item.qty || 1}
                                                                        onChange={(e) => handleUpdateCartQty(item.id, e.target.value)}
                                                                        className="w-full bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-lg px-1.5 py-1 text-xs font-black"
                                                                    />
                                                                </div>
                                                            )}

                                                            <div className="flex items-center gap-0.5 w-20">
                                                                <span className="text-xs font-bold">৳</span>
                                                                <input
                                                                    type="number"
                                                                    value={item.sellPrice}
                                                                    onChange={(e) => handleUpdateCartPrice(item.id, e.target.value)}
                                                                    className="w-full bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-lg px-1.5 py-1 text-xs font-black text-right"
                                                                />
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>

                                        <div className="grid grid-cols-2 gap-1.5 pt-2 border-t border-zinc-200 dark:border-zinc-700">
                                            <input
                                                type="text"
                                                placeholder="কাস্টমারের নাম"
                                                value={customerName}
                                                onChange={e => setCustomerName(e.target.value)}
                                                className="p-2 bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                            />
                                            <input
                                                type="text"
                                                placeholder="মোবাইল নম্বর"
                                                value={customerPhone}
                                                onChange={e => setCustomerPhone(e.target.value)}
                                                className="p-2 bg-zinc-100/80 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                            />
                                        </div>

                                        <div className="space-y-1.5 mt-3 bg-zinc-100/80 dark:bg-zinc-800/80 p-3 rounded-2xl border border-zinc-200 dark:border-zinc-700">
                                            <div className="flex justify-between text-xs font-bold">
                                                <span>সাবটোটাল</span>
                                                <span>৳{formatNumber(cartSubtotal)}</span>
                                            </div>
                                            <div className="flex items-center justify-between text-xs font-bold">
                                                <span>ছাড় (৳)</span>
                                                <input
                                                    type="number"
                                                    value={discount}
                                                    onChange={e => setDiscount(e.target.value)}
                                                    placeholder="০"
                                                    className="w-20 p-1 bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-lg text-right font-bold text-xs"
                                                />
                                            </div>
                                            <div className="flex justify-between text-xs font-black border-t border-zinc-200 dark:border-zinc-700 pt-1.5">
                                                <span>মোট</span>
                                                <span className="text-emerald-600 dark:text-emerald-400 text-sm">৳{formatNumber(cartTotal)}</span>
                                            </div>
                                            <div className="flex items-center justify-between text-xs font-bold pt-0.5 gap-1.5">
                                                <span>জমা (৳)</span>
                                                <div className="flex items-center gap-1.5">
                                                    <button
                                                        type="button"
                                                        onClick={() => setPaidAmount(cartTotal > 0 ? cartTotal.toString() : '')}
                                                        className="px-2 py-1 rounded-lg bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 font-black text-[10px] water-drop-btn"
                                                    >
                                                        সম্পূর্ণ পরিশোধ
                                                    </button>
                                                    <input
                                                        type="number"
                                                        value={paidAmount}
                                                        onChange={e => setPaidAmount(e.target.value)}
                                                        placeholder="টাকা"
                                                        className="w-24 p-1 bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-lg text-right font-black text-xs"
                                                    />
                                                </div>
                                            </div>
                                            {cartDue > 0 && (
                                                <div className="flex justify-between text-xs font-bold text-rose-600 dark:text-rose-400">
                                                    <span>বাকি</span>
                                                    <span>৳{formatNumber(cartDue)}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <button
                                        onClick={handleCheckout}
                                        className="w-full mt-3 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-black py-2.5 rounded-2xl text-xs shadow-md water-drop-btn"
                                    >
                                        মেমো তৈরি করুন
                                    </button>
                                </div>
                            </div>

                                            কোন কোন ইউনিটে বিক্রি করা যাবে?
                                        </div>
                                        <div className="flex flex-wrap gap-1.5">
                                            {customUnits.map(u => {
                                                const isBase = productForm.unit === u.id;
                                                const checked = isBase || productForm.allowedUnits.includes(u.id);
                                                return (
                                                    <button
                                                        key={u.id}
                                                        type="button"
                                                        onClick={() => toggleFormAllowedUnit(u.id)}
                                                        className={`px-2 py-1 rounded-lg text-[11px] font-bold border transition-all ${
                                                            checked
                                                                ? 'bg-emerald-500 text-zinc-950 border-emerald-500'
                                                                : 'bg-white dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 border-zinc-300 dark:border-zinc-700'
                                                        }`}
                                                    >
                                                        {u.label} {isBase ? '(মূল)' : ''}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <input
                                            type="number" required
                                            value={productForm.buyPrice}
                                            onChange={e => setProductForm({ ...productForm, buyPrice: e.target.value })}
                                            placeholder="ক্রয়মূল্য (৳)"
                                            className="p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                        />
                                        <input
                                            type="number" required
                                            value={productForm.sellPrice}
                                            onChange={e => setProductForm({ ...productForm, sellPrice: e.target.value })}
                                            placeholder="বিক্রয়মূল্য (৳)"
                                            className="p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="relative flex items-center">
                                            <input
                                                type="number" step="any" required
                                                value={productForm.stock}
                                                onChange={e => setProductForm({ ...productForm, stock: e.target.value })}
                                                placeholder={`স্টক (${getUnitLabel(productForm.unit)})`}
                                                className="w-full p-2 pr-14 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                            />
                                            <span className="absolute right-2.5 text-[11px] font-black text-emerald-600 dark:text-emerald-400">
                                                {getUnitLabel(productForm.unit)}
                                            </span>
                                        </div>
                                        <select
                                            value={productForm.bostaSizeKg}
                                            onChange={e => setProductForm({ ...productForm, bostaSizeKg: Number(e.target.value) })}
                                            className="p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                        >
                                            <option value={25}>২৫ কেজি বস্তা</option>
                                            <option value={50}>৫০ কেজি বস্তা</option>
                                        </select>
                                    </div>

                                    <button type="submit" className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-black rounded-xl text-xs water-drop-btn">
                                        সংরক্ষণ করুন
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add Custom Category */}
                    {showAddCatModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="glass-card rounded-3xl p-5 max-w-xs w-full space-y-3 animate-slide-in">
                                <div className="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-700 pb-2">
                                    <h3 className="font-black text-sm">নতুন ক্যাটাগরি</h3>
                                    <button onClick={() => setShowAddCatModal(false)} className="p-1 rounded-lg bg-zinc-200 dark:bg-zinc-800">
                                        <Icon name="X" size={16} />
                                    </button>
                                </div>
                                <form onSubmit={handleAddCategory} className="space-y-2.5">
                                    <input
                                        type="text"
                                        autoFocus
                                        required
                                        value={newCatName}
                                        onChange={e => setNewCatName(e.target.value)}
                                        placeholder="যেমন: কসমেটিকস"
                                        className="w-full p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                    />
                                    <button type="submit" className="w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-black rounded-xl text-xs water-drop-btn">
                                        যোগ করুন
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Add Custom Unit */}
                    {showAddUnitModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="glass-card rounded-3xl p-5 max-w-xs w-full space-y-3 animate-slide-in">
                                <div className="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-700 pb-2">
                                    <div>
                                        <h3 className="font-black text-sm">নতুন ইউনিট ও হিসাব</h3>
                                        <p className="text-[10px] text-zinc-500 font-bold">শুধু নির্দিষ্ট পণ্যের জন্য ইউনিট যুক্ত হবে</p>
                                    </div>
                                    <button onClick={() => setShowAddUnitModal(false)} className="p-1 rounded-lg bg-zinc-200 dark:bg-zinc-800">
                                        <Icon name="X" size={16} />
                                    </button>
                                </div>
                                <form onSubmit={handleAddCustomUnit} className="space-y-2.5">
                                    <div>
                                        <label className="text-[10px] font-bold text-zinc-500 block mb-1">কোন পণ্যের জন্য ইউনিট?</label>
                                        <select
                                            value={newUnitTargetProductId}
                                            onChange={e => setNewUnitTargetProductId(e.target.value)}
                                            className="w-full p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                        >
                                            {priceModalProduct && (
                                                <option value="selected">
                                                    বর্তমান পণ্য: {priceModalProduct.name}
                                                </option>
                                            )}
                                            {products.map(p => (
                                                <option key={p.id} value={p.id}>{p.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-bold text-zinc-500 block mb-1">ইউনিটের নাম</label>
                                        <input
                                            type="text"
                                            autoFocus
                                            required
                                            value={newUnitLabel}
                                            onChange={e => setNewUnitLabel(e.target.value)}
                                            placeholder="যেমন: কার্টন, প্যাকেট, বক্স"
                                            className="w-full p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                        />
                                    </div>

                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-zinc-500 block mb-1">কয়টি থাকে?</label>
                                            <input
                                                type="number"
                                                min="0.01"
                                                step="any"
                                                value={newUnitPackQty}
                                                onChange={e => setNewUnitPackQty(e.target.value)}
                                                placeholder="যেমন: ১২"
                                                className="w-full p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-zinc-500 block mb-1">প্রতিটির মাপ</label>
                                            <input
                                                type="number"
                                                min="0"
                                                step="any"
                                                value={newUnitItemSize}
                                                onChange={e => setNewUnitItemSize(e.target.value)}
                                                placeholder="যেমন: ২"
                                                className="w-full p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-zinc-500 block mb-1">মাপের একক</label>
                                            <select
                                                value={newUnitItemSizeUnit}
                                                onChange={e => setNewUnitItemSizeUnit(e.target.value)}
                                                className="w-full p-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl text-xs font-bold"
                                            >
                                                <option value="liter">লিটার</option>
                                                <option value="kg">কেজি</option>
                                                <option value="gram">গ্রাম</option>
                                                <option value="piece">পিস</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="p-2 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-[10px] font-bold text-emerald-700 dark:text-emerald-300">
                                        উদাহরণ: ১ কার্টনে ১২টি ২ লিটার তেলের বোতল থাকলে সংখ্যা দিন ১২, মাপ দিন ২ এবং একক দিন লিটার (মোট ২৪ লিটার হিসেবে দাম হিসাব হবে)।
                                    </div>

                                    <button type="submit" className="w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 font-black rounded-xl text-xs water-drop-btn">
                                        যোগ করুন
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal: Invoice Memo */}
                    {showInvoiceModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white text-zinc-900 rounded-3xl p-5 max-w-xs w-full space-y-3 shadow-2xl animate-slide-in">
                                <div id="printable-invoice" className="space-y-2.5">
                                    <div className="text-center border-b border-zinc-200 pb-2">
                                        <h3 className="font-black text-base">{shopName}</h3>
                                        <p className="text-[10px] text-zinc-500 font-bold">{shopSubTitle}</p>
                                        <p className="text-[10px] text-zinc-400">#{showInvoiceModal.id} • {showInvoiceModal.date}</p>
                                        {showInvoiceModal.customerName && (
                                            <p className="text-xs font-bold mt-0.5">{showInvoiceModal.customerName}</p>
                                        )}
                                    </div>

                                    <div className="space-y-1.5 text-xs">
                                        {showInvoiceModal.items?.map((it, idx) => (
                                            <div key={idx} className="flex justify-between items-start border-b border-dashed border-zinc-200 pb-1">
                                                <div>
                                                    <span className="font-bold">{it.name}</span>
                                                    <span className="text-[10px] text-zinc-500 font-bold block">
                                                        {(it.unit === 'kg' || it.unit === 'gram') && it.grams
                                                            ? formatGramsToKgOrGram(it.grams)
                                                            : `${formatNumber(it.qty)} ${getUnitLabel(it.unit)}`}
                                                    </span>
                                                </div>
                                                <span className="font-black">৳{formatNumber(it.sellPrice)}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="border-t border-zinc-300 pt-2 space-y-1 text-xs font-bold">
                                        <div className="flex justify-between">
                                            <span>মোট</span>
                                            <span>৳{formatNumber(showInvoiceModal.total)}</span>
                                        </div>
                                        <div className="flex justify-between text-emerald-700">
                                            <span>জমা</span>
                                            <span>৳{formatNumber(showInvoiceModal.paid)}</span>
                                        </div>
                                        {showInvoiceModal.due > 0 && (
                                            <div className="flex justify-between text-rose-600">
                                                <span>বাকি</span>
                                                <span>৳{formatNumber(showInvoiceModal.due)}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2 pt-1 no-print">
                                    <button
                                        onClick={handleDownloadPDF}
                                        className="py-2 bg-zinc-900 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1"
                                    >
                                        <Icon name="Download" size={14} /> PDF
                                    </button>
                                    <button
                                        onClick={() => window.print()}
                                        className="py-2 bg-emerald-500 text-zinc-950 rounded-xl text-xs font-black flex items-center justify-center gap-1"
                                    >
                                        <Icon name="Printer" size={14} /> প্রিন্ট
                                    </button>
                                </div>
                                <button
                                    onClick={() => setShowInvoiceModal(null)}
                                    className="w-full py-1.5 bg-zinc-100 text-zinc-800 rounded-xl text-xs font-bold no-print"
                                >
                                    বন্ধ করুন
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
